name: Probe Tyler Odyssey (Tarrant + Denton + Johnson)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
      - name: Install Chromium
        run: playwright install chromium --with-deps
      - name: Run probe
        run: python probe_tyler_odyssey.py
      - name: Upload screenshots/HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyler-odyssey-probe-output
          path: probe_out/
          if-no-files-found: warn
