name: Probe Tyler Odyssey (Tarrant + Denton + Johnson)

# workflow_dispatch can't be triggered by name/API until this file is merged
# to the default branch (a hard GitHub platform limitation). This is a
# throwaway probe living only on this branch, so trigger on push-to-this-
# branch instead (avoids touching main; other agents work this repo
# concurrently on their own branches). Path-filtered so unrelated commits on
# this branch don't re-trigger it.
on:
  workflow_dispatch: {}
  push:
    branches: ['add-tarrant-denton-johnson-probate-scrapers']
    paths:
      - 'probe_tyler_odyssey.py'
      - '.github/workflows/probe_tyler_odyssey.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: |
          pip install -r requirements.txt
      - name: Install Chromium
        run: playwright install chromium --with-deps
      - name: Run probe
        run: python probe_tyler_odyssey.py
      - name: Upload screenshots/HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyler-odyssey-probe-output
          path: probe_out/
          if-no-files-found: warn
