name: Probe Odyssey Portal (Dallas / Travis)

# Throwaway investigation workflow -- see SYSTEM_GUIDE.md S6. Safe to delete
# once scrapers for Dallas/Travis are written and confirmed working via
# daily_scrape.yml dry runs.
#
# Triggers on push (paths-filtered) to this branch so it self-runs while
# iterating. workflow_dispatch normally requires the workflow file to exist
# on the repo's DEFAULT branch before it becomes dispatchable at all (a real
# GitHub API constraint, confirmed via a 404 "not found on the default
# branch" from `gh workflow run` against this branch) -- pushing straight to
# main to work around that is out of scope here (branch -> PR -> user-merge
# only), so `push` is the trigger that actually works pre-merge. Editing
# DEFAULT_BASE_URL/DEFAULT_COUNTY below (or the .py script itself) + pushing
# is the iteration loop. workflow_dispatch inputs are still wired up for
# later/manual convenience once this is mergeable.

on:
  push:
    branches:
      - add-dallas-travis-probate-scrapers
    paths:
      - 'probe_odyssey_portal.py'
      - '.github/workflows/probe_odyssey_portal.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Portal base URL to probe (blank = DEFAULT_BASE_URL below)'
        required: false
        default: ''
      county:
        description: 'County label, for logging/screenshot filenames (blank = DEFAULT_COUNTY below)'
        required: false
        default: ''
      click_path:
        description: 'Pipe-separated link/button text to click through in sequence, e.g. "Case Records|Probate"'
        required: false
        default: ''
      extra_paths:
        description: 'Pipe-separated relative paths (under base_url) to also load, e.g. "/Home/Dashboard/29|/SmartSearch/SmartSearch"'
        required: false
        default: ''
      direct_urls:
        description: 'Pipe-separated FULL URLs to also load verbatim (e.g. a hypothesized results query URL)'
        required: false
        default: ''
      type_into:
        description: 'Pipe-separated selector_hint=text pairs to click+type into (Kendo comboboxes etc), e.g. "CourtLocation_input=Probate"'
        required: false
        default: ''

env:
  # Used on `push`-triggered runs (no inputs available) and as the fallback
  # when a workflow_dispatch input is left blank. Edit these to aim the next
  # push-triggered iteration at a different county/URL/click-path.
  DEFAULT_BASE_URL: 'https://courtsportal.dallascounty.org/DALLASPROD'
  DEFAULT_COUNTY: 'Dallas'
  DEFAULT_CLICK_PATH: ''
  DEFAULT_EXTRA_PATHS: ''
  DEFAULT_DIRECT_URLS: 'https://courtsportal.dallascounty.org/DALLASPROD/Home/Dashboard/29'
  DEFAULT_TYPE_INTO: 'CourtLocation_input=Probate'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium + system deps
        run: playwright install --with-deps chromium

      - name: Run probe
        run: |
          python probe_odyssey_portal.py \
            --base-url "${{ github.event.inputs.base_url || env.DEFAULT_BASE_URL }}" \
            --county "${{ github.event.inputs.county || env.DEFAULT_COUNTY }}" \
            --click "${{ github.event.inputs.click_path || env.DEFAULT_CLICK_PATH }}" \
            --extra-paths "${{ github.event.inputs.extra_paths || env.DEFAULT_EXTRA_PATHS }}" \
            --direct-urls "${{ github.event.inputs.direct_urls || env.DEFAULT_DIRECT_URLS }}" \
            --type-into "${{ github.event.inputs.type_into || env.DEFAULT_TYPE_INTO }}"

      - name: Upload screenshots + state/network JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.event.inputs.county || env.DEFAULT_COUNTY }}-${{ github.run_id }}
          path: |
            probe_*.png
            probe_*.json
          if-no-files-found: warn
