name: Probe Odyssey (Collin + platform sweep)

on:
  workflow_dispatch: {}
  # workflow_dispatch alone can't be triggered by name until this file is on
  # the default branch. This is a throwaway probe living only on this branch,
  # so trigger on push-to-this-branch instead (avoids touching main).
  push:
    branches: [add-collin-probate-scraper]
    paths:
      - 'probe_odyssey.py'
      - '.github/workflows/probe_odyssey.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium firefox webkit

      - name: Run probe
        run: python probe_odyssey.py
